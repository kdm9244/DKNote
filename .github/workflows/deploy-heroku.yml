
name: Deploy DKNote to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.HEROKU_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEROKU_APP_NAME: dokumo-note

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check migration versions
        run: node scripts/check-migration-versions.mjs

      - name: Check deployment credential
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Register HEROKU_API_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Build Docker image (tests skipped)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            --output type=docker,oci-mediatypes=false \
            -t "registry.heroku.com/$HEROKU_APP_NAME/web" .

      - name: Authenticate and push image
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          printf '%s' "$HEROKU_API_KEY" | \
            docker login registry.heroku.com \
            --username=_ --password-stdin

          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Install Heroku CLI
        run: |
          curl -fsSL https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Verify Heroku app access
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku apps:info --app "$HEROKU_APP_NAME"

      - name: Release image to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web --app "$HEROKU_APP_NAME"

      - name: Clear registry login
        if: always()
        run: docker logout registry.heroku.com
